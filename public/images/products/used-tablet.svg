  <text x="400" y="534" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="25" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">TABLET</text>
  <text x="400" y="562" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="500" fill="#8b93a7" text-anchor="middle" letter-spacing="3">CERTIFIED PRE-OWNED</text>
