    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>
  <ellipse cx="400" cy="275" rx="300" ry="215" fill="url(#halo)"/>
  <g filter="url(#glow)">
    <rect x="268" y="116" width="264" height="318" rx="22" stroke="url(#neon)" stroke-width="4" fill="#111827"/>
    <rect x="286" y="146" width="228" height="258" rx="10" fill="url(#screen)"/>
    <circle cx="400" cy="130" r="4" fill="#64748b"/>
