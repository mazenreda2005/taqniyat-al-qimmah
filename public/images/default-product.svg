<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/>
  </g>

  <!-- Central Tech Shield / Product Showcase -->
  <g filter="url(#glow)">
    <polygon points="400,120 540,200 540,360 400,440 260,360 260,200" fill="url(#cardGrad)" stroke="url(#neonGlow)" stroke-width="3"/>
  </g>

  <!-- Inner Hardware / Chip Graphic -->
  <rect x="340" y="220" width="120" height="120" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="400" cy="280" r="30" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="8 4"/>
  <path d="M400 260 L400 300 M380 280 L420 280" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Circuit Trace Accents -->
  <path d="M260 280 L340 280 M460 280 L540 280 M400 120 L400 220 M400 340 L400 440" stroke="url(#neonGlow)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Watermark Text -->
  <text x="400" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="3">TAQNIYAT AL-QIMMAH</text>
  <text x="400" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="1">HIGH PERFORMANCE TECH SOLUTION</text>
</svg>
