<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="cloudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#cloudBg)"/>

  <!-- Cloud Shape Path -->
  <g filter="url(#cloudGlow)">
    <path d="M 280 320 
             A 60 60 0 0 1 340 220 
             A 90 90 0 0 1 500 220 
             A 70 70 0 0 1 560 320 
             A 50 50 0 0 1 530 400 
             L 270 400 
             A 50 50 0 0 1 280 320 Z" 
          fill="url(#cloudGrad)" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Lock Icon on Cloud -->
  <rect x="375" y="295" width="50" height="45" rx="8" fill="#0284c7" stroke="#e0f2fe" stroke-width="2.5"/>
  <path d="M386 295 V280 C386 270 392 262 400 262 C408 262 414 270 414 280 V295" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round"/>
  <circle cx="400" cy="315" r="5" fill="#e0f2fe"/>

  <text x="400" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#e0f2fe" text-anchor="middle" letter-spacing="3">SECURE CLOUD INFRASTRUCTURE</text>
</svg>
